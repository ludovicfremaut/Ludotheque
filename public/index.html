<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ludothèque - Ma Collection de Jeux</title>
  <meta name="description" content="Trouvez le jeu parfait pour votre soirée jeux">
  <link rel="stylesheet" href="src/css/main.css">
  <script type="module" src="src/js/main.js" defer></script>
</head>

<body>
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="/" class="logo">
        <span class="logo-icon">🎲</span>
        <span class="logo-text">Ma Ludothèque</span>
      </a>

      <ul class="nav-links">
        <li><a href="/jeux">Mes Jeux</a></li>
        <li><a href="/explorer">Explorer</a></li>
        <li><a href="/aleatoire">Jeu Aléatoire</a></li>
      </ul>

      <div class="navbar-right">
        <div class="search-box">
          <input type="search" placeholder="Rechercher des jeux..." aria-label="Rechercher des jeux" />
          <span class="search-icon">🔍</span>

          <button class="notifications-btn" aria-label="Notifications">
            <span>🔔</span>
          </button>

          <div class="profile-avatar" aria-label="Profil Utilisateur">
            <img src="https://via.placeholder.com/40" alt="Avatar Utilisateur" />
          </div>
        </div>
      </div>
  </nav>

  <main>
    <section class="hero">
      <div class="container hero-content">
        <h1 class="hero-title">Trouvez Votre Prochaine Aventure de Soirée Jeux</h1>
        <p class="hero-subtitle">Explorez, découvrez et organisez des soirées jeux inoubliables avec notre ludothèque en
          ligne.</p>
        <div class="hero-search">
          <input type="search" class="hero-search-input" placeholder="Rechercher des jeux..." aria-label="Rechercher des jeux" />
          <button class="hero-search-btn">Rechercher</button>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
